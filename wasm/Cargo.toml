[package]
name = "fp-web-patcher"
version = "0.5.0"
edition = "2024"
description = "A wasm application that makes it easy to patch N64 roms for multiple platforms"
repository = "https://github.com/imaandrew/fp-site"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adler32 = "1.2.0"
aes = "0.9.4"
aho-corasick = "1.1.5"
cbc = { version = "0.2.1", features = ["alloc"] }
console_error_panic_hook = "0.1.7"
md5 = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11.19"
sha-1 = "0.10.1"
tar = "0.4.46"
thiserror = "2.0.21"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.130"
zip = "9.8.2"

[profile.release]
opt-level = "s"
lto = true
